apply plugin: 'maven-publish'

// Simple sources jar
task sourcesJar(type: Jar) {
    archiveClassifier.set("sources")
    from android.sourceSets.main.java.srcDirs
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                
                groupId = rootProject.ext.artifactGroupId
                artifactId = project.name.toLowerCase().replace('prebidmobile-', 'prebid-mobile-sdk-')
                version = rootProject.ext.prebidSdkVersionName
                
                // Add sources artifact
                artifact sourcesJar
                
                pom {
                    name = project.name
                    description = 'Prebid Mobile SDK for Android'
                    url = 'https://https://github.com/veonadtech/prebid-android-sdk'
                    packaging = 'aar'
                    
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    
                    developers {
                        developer {
                            id = 'prebid'
                            name = 'Prebid.org'
                            email = 'info@prebid.org'
                        }
                    }
                    
                    scm {
                        connection = 'scm:git:git://https://github.com/veonadtech/prebid-android-sdk.git'
                        developerConnection = 'scm:git:ssh://github.com:veonadtech/prebid-android-sdk.git'
                        url = 'https://https://github.com/veonadtech/prebid-android-sdk/tree/master'
                    }
                    
                    // Fix dependency names in POM
                    withXml {
                        def dependenciesNode = asNode().appendNode('dependencies')
                        
                        configurations.implementation.allDependencies.each { dep ->
                            if (dep.group != null && dep.name != 'unspecified') {
                                def dependencyNode = dependenciesNode.appendNode('dependency')
                                
                                // Fix OMSDK dependency name
                                if (dep.name == 'omsdk-android') {
                                    dependencyNode.appendNode('groupId', rootProject.ext.artifactGroupId)
                                    dependencyNode.appendNode('artifactId', 'prebid-mobile-sdk-open-measurement')
                                    dependencyNode.appendNode('version', rootProject.ext.omSdkVersion)
                                } else {
                                    dependencyNode.appendNode('groupId', dep.group)
                                    dependencyNode.appendNode('artifactId', dep.name)
                                    dependencyNode.appendNode('version', dep.version)
                                }
                                dependencyNode.appendNode('scope', 'runtime')
                            }
                        }
                        
                        configurations.api?.allDependencies?.each { dep ->
                            if (dep.group != null && dep.name != 'unspecified') {
                                def dependencyNode = dependenciesNode.appendNode('dependency')
                                
                                // Fix OMSDK dependency name for API dependencies
                                if (dep.name == 'omsdk-android') {
                                    dependencyNode.appendNode('groupId', rootProject.ext.artifactGroupId)
                                    dependencyNode.appendNode('artifactId', 'prebid-mobile-sdk-open-measurement')
                                    dependencyNode.appendNode('version', rootProject.ext.omSdkVersion)
                                } else {
                                    dependencyNode.appendNode('groupId', dep.group)
                                    dependencyNode.appendNode('artifactId', dep.name)
                                    dependencyNode.appendNode('version', dep.version)
                                }
                                dependencyNode.appendNode('scope', 'compile')
                            }
                        }
                    }
                }
            }
        }
    }
}