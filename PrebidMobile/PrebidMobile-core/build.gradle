apply from: '../android.gradle'
apply from: '../publisher.gradle'
apply from: '../tests.gradle'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "org.prebid.mobile.core"

    buildFeatures {
        buildConfig true
    }

    def getGitHash = { ->
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        buildConfigField "String", "GitHash", "\"${getGitHash()}\""
        buildConfigField "String", "VERSION", "\"${versionName}\""
        buildConfigField "String", "OMSDK_VERSION", "\"${omSdkVersion}\""
        multiDexEnabled true
    }
    testOptions {
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
            systemProperty 'robolectric.invokedynamic.enable', 'false'
        }
    }
}

dependencies {
    implementation project(":omsdk-android")

    implementation 'androidx.annotation:annotation:1.9.1'

    implementation 'com.google.android.gms:play-services-base:18.1.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.15.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.15.1'

    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.0.0"
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // Yandex Mobile Ads SDK core lib
    implementation("com.yandex.android:mobileads:7.14.1")
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = "org.prebid.mobile"
                artifactId = "core"
                version = '1.0.0'
            }
        }
    }
}