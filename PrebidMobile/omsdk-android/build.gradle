// In case of updating version don't forget to update const omSdkVersion in build.gradle (root)
// and check buildPrebidMobile.sh script

apply plugin: 'maven-publish'

configurations.maybeCreate("default")
artifacts.add("default", file("${omSdkModuleName}-${omSdkVersion}.aar"))

afterEvaluate {
    publishing {
        publications {
            maven(MavenPublication) {
                groupId = rootProject.ext.artifactGroupId
                artifactId = 'prebid-mobile-sdk-open-measurement'
                version = rootProject.ext.omSdkVersion
                
                artifact("${omSdkModuleName}-${omSdkVersion}.aar") {
                    extension = 'aar'
                }
                
                pom {
                    name = 'Prebid Mobile Open Measurement SDK'
                    description = 'Open Measurement SDK for Prebid Mobile Android'
                    url = 'https://github.com/veonadtech/prebid-android-sdk'
                    packaging = 'aar'
                    
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    
                    developers {
                        developer {
                            id = 'prebid'
                            name = 'Prebid.org'
                            email = 'info@prebid.org'
                        }
                    }
                    
                    scm {
                        connection = 'scm:git:git://https://github.com/veonadtech/prebid-android-sdk.git'
                        developerConnection = 'scm:git:ssh://github.com:veonadtech/prebid-android-sdk.git'
                        url = 'https://https://github.com/veonadtech/prebid-android-sdk/tree/master'
                    }
                }
            }
        }
    }
}