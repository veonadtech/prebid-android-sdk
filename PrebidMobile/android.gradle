apply plugin: 'com.android.library'
apply plugin:  'kotlin-android'
apply plugin: 'maven-publish'

group = 'com.github.veonadtech'

android {
    namespace "org.prebid.mobile"
    setCompileSdkVersion(rootProject.prebidSdkCompileVersion)
    setBuildToolsVersion(rootProject.prebidSdkBuildToolsVersion)

    defaultConfig {
        minSdkVersion rootProject.prebidSdkMinVersion
        targetSdkVersion rootProject.prebidSdkTargetVersion
        versionCode 1
        versionName rootProject.prebidSdkVersionName
        multiDexEnabled true
    }

    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            consumerProguardFiles file('proguard-rules.pro')
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            consumerProguardFiles file('proguard-rules.pro')
        }
    }

    buildFeatures {
        viewBinding true
    }

    lintOptions {
        abortOnError false
    }

    testOptions.unitTests {
        includeAndroidResources true
        returnDefaultValues = true
        all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo1.maven.org/maven2'
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                exceptionFormat = "full"
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/LICENSE'
    }
}

// The Mintegral/MBridge mediation adapter (pulled transitively by the Yandex mediation SDK) ships
// pre-stackmap bytecode (e.g. com.mbridge.msdk...NetWorkChangeReceiver) that JDK 17 rejects with
// VerifyError when Robolectric loads its manifest-declared receivers. It is irrelevant to the unit
// tests, so drop it (and its MBridge transitives) from the unit-test configurations of every module;
// the shipped product keeps Mintegral.
configurations.configureEach {
    if (name.toLowerCase().contains('unittest')) {
        exclude group: 'com.yandex.ads.mediation', module: 'mobileads-mintegral'
        exclude group: 'com.mbridge.msdk.oversea'
        exclude group: 'com.mbridge.msdk'
    }
}