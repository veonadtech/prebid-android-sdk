apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    setCompileSdkVersion(rootProject.prebidSdkCompileVersion)
    setBuildToolsVersion(rootProject.prebidSdkBuildToolsVersion)

    defaultConfig {
        minSdkVersion rootProject.prebidSdkMinVersion
        targetSdkVersion rootProject.prebidSdkTargetVersion
        versionCode 1
        versionName rootProject.prebidSdkVersionName
    }

    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            consumerProguardFiles file('proguard-rules.pro')
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            consumerProguardFiles file('proguard-rules.pro')
        }
    }

    lintOptions {
        abortOnError false
    }

    testOptions.unitTests {
        includeAndroidResources true
        returnDefaultValues = true
        all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo1.maven.org/maven2'
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                exceptionFormat = "full"
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packagingOptions {
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/LICENSE'
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = 'org.prebid'
                artifactId = 'prebid-mobile-sdk-core'
                version = '2.1.4'

                artifact("$buildDir/outputs/aar/${project.name}-release.aar") {
                    builtBy tasks.named('assembleRelease')
                }

                /*
                artifact sourcesJar {
                    classifier 'sources'
                    builtBy tasks.named('sourcesJar')
                }

                artifact javadocJar {
                    classifier 'javadoc'
                    builtBy tasks.named('javadocJar')
                }
                */

                pom.withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')
                    configurations.api.allDependencies.each { dep ->
                        def dependencyNode = dependenciesNode.appendNode('dependency')
                        dependencyNode.appendNode('groupId', dep.group)
                        dependencyNode.appendNode('artifactId', dep.name)
                        dependencyNode.appendNode('version', dep.version)
                    }
                }
            }
        }
    }
}

