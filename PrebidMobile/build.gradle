apply from: 'android.gradle'
apply from: 'publisher.gradle'
apply plugin: 'maven-publish'

android {
    namespace "org.prebid.mobile"
}

dependencies {
    api project(':PrebidMobile-core')
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = 'com.github.veonadtech'
                artifactId = 'prebid-android-sdk'
                version = 'v0.0.3.7-gradle-8.2.x'

                artifact("$buildDir/outputs/aar/PrebidMobile-release.aar")

                pom.withXml {
                    def deps = asNode().appendNode('dependencies')

                    configurations.api.allDependencies.each { dep ->
                        if (dep.name != 'unspecified' && dep.group != null) {
                            def depNode = deps.appendNode('dependency')
                            depNode.appendNode('groupId', dep.group)
                            depNode.appendNode('artifactId', dep.name)
                            depNode.appendNode('version', dep.version)
                            depNode.appendNode('scope', 'compile')
                        }
                    }

                    configurations.implementation.allDependencies.each { dep ->
                        if (dep.name != 'unspecified' && dep.group != null && !configurations.api.allDependencies.contains(dep)) {
                            def depNode = deps.appendNode('dependency')
                            depNode.appendNode('groupId', dep.group)
                            depNode.appendNode('artifactId', dep.name)
                            depNode.appendNode('version', dep.version)
                            depNode.appendNode('scope', 'runtime')
                        }
                    }
                }
            }
        }
    }
}