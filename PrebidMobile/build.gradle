apply from: 'android.gradle'
apply from: 'publisher.gradle'
apply plugin: 'maven-publish'

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'org.prebid'
            artifactId = 'prebid-mobile-sdk-core'
            version = '2.1.4'
            // Для Android-библиотек:
            afterEvaluate {
                from components.release
            }
        }
    }
}

android {
    namespace "org.prebid.mobile"
}

dependencies {
    api project(':PrebidMobile-core')
}