apply from: 'android.gradle'
apply from: 'publisher.gradle'

android {
    namespace "org.prebid.mobile"
}

dependencies {
    api project(':PrebidMobile-core')
}

// Main SDK - override artifact ID
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                artifactId = 'prebid-mobile-sdk'
            }
        }
    }
}