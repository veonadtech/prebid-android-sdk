apply from: '../android.gradle'
apply from: '../publisher.gradle'
apply from: '../tests.gradle'
apply plugin: 'maven-publish'

android {
    namespace "org.prebid.mobile.gam"
    defaultConfig {
        minSdkVersion 19
    }
}

dependencies {
    implementation project(":PrebidMobile")
    implementation 'com.google.android.gms:play-services-ads:21.0.0'
}

publishing {
    publications {
        gamEventHandlers(MavenPublication) {
            groupId = 'com.github.veonadtech.prebid-android-sdk'
            artifactId = 'eventhandlers'
            version = 'v0.0.3.7-gradle-8.2.x'
            artifact("$buildDir/outputs/aar/PrebidMobile-gamEventHandlers-release.aar")

            pom.withXml {
                def deps = asNode().appendNode('dependencies')
                configurations.implementation.allDependencies.each { dep ->
                    if (dep.name != 'unspecified' && dep.group != null) {
                        def depNode = deps.appendNode('dependency')
                        depNode.appendNode('groupId', dep.group)
                        depNode.appendNode('artifactId', dep.name)
                        depNode.appendNode('version', dep.version)
                    }
                }
            }
        }
    }
}
