apply from: '../android.gradle'
apply from: '../publisher.gradle'
apply from: '../tests.gradle'

dependencies {
    implementation project(":PrebidMobile")
    implementation libs.google.play.services.ads
}

android {
    namespace "org.prebid.mobile.eventhandlers"
    defaultConfig {
        namespace 'org.prebid.mobile.eventhandlers'
        minSdkVersion rootProject.prebidSdkMinVersion
    }
    testOptions {
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
            //Resolves VerifyError: Stackmap frame issue with Mintegral/MBridge library in Robolectric tests
            jvmArgs '-noverify'
            systemProperty 'robolectric.invokedynamic.enable', 'false'
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = "org.prebid.mobile"
                artifactId = "eventhandlers"
                version = '1.0.0'
            }
        }
    }
}