jdk: openjdk17

before_install:
  - chmod +x gradlew
  - sdk install java 17.0.14-amzn || true
  - sdk use java 17.0.14-amzn

install:
  - ./gradlew clean
  - ./gradlew :PrebidMobile-core:assembleRelease publishToMavenLocal
    :PrebidMobile:assembleRelease publishToMavenLocal
    :PrebidMobile-gamEventHandlers:assembleRelease publishToMavenLocal
    -x test -x lint --stacktrace