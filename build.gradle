ext {
    prebidSdkVersionName = "0.1.2"
    prebidSdkMinVersion = 16
    prebidSdkTargetVersion = 35
    prebidSdkCompileVersion = 35
    prebidSdkBuildToolsVersion = "35.0.1"

    artifactGroupId = "org.prebid"
    artifactFolder = "${buildDir}/generated-artifacts"
    omSdkVersion = "1.4.1"
    omSdkModuleName = "omsdk-android"
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath libs.gradle
        classpath libs.kotlin.gradle.plugin
    }
}

allprojects {
    repositories {
        google()
        maven {
            name = "Central Portal Snapshots"
            url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        }
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url 'https://jitpack.io' }
//        maven { url "https://oss.sonatype.org/content/repositories/orgprebid-1079" }
    }

    // Global dependency resolution strategy to handle Guava conflicts
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.google.guava' && details.requested.name == 'listenablefuture') {
                details.useTarget('androidx.concurrent:concurrent-futures:1.1.0')
                details.because('Use androidx.concurrent.futures instead of guava listenablefuture to avoid conflicts')
            }
        }
    }
}

allprojects {
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
        }
    }
}
