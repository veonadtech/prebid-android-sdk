ext {
    prebidSdkVersionName = "0.0.7"
    prebidSdkMinVersion = 16
    prebidSdkTargetVersion = 34
    prebidSdkCompileVersion = 34
    prebidSdkBuildToolsVersion = "35.0.1"

    artifactGroupId = "org.prebid"
    artifactFolder = "${buildDir}/generated-artifacts"
    omSdkVersion = "1.4.1"
    omSdkModuleName = "omsdk-android"
}

buildscript {
    ext {
        kotlin_version = '1.8.10'
        agp_version = "8.1.1"
    }
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url 'https://jitpack.io' }
        maven { url "https://oss.sonatype.org/content/repositories/orgprebid-1079" }
    }

    // Global dependency resolution strategy to handle Guava conflicts
    configurations.all {
        resolutionStrategy {
            // Force exclude guava's listenablefuture to prevent conflicts with CameraX
            exclude group: 'com.google.guava', module: 'listenablefuture'

            // Ensure consistent concurrent-futures usage
            force 'androidx.concurrent:concurrent-futures:1.1.0'
        }
    }
}

allprojects {
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
        }
    }
}
