apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "org.prebid.mobile.prebidveonnextgendemo"
    setCompileSdkVersion(34)
    setBuildToolsVersion("35.0.1")
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        applicationId "org.prebid.mobile.prebidveonnextgendemo"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
    buildFeatures {
        dataBinding true
    }
    // Fix for Exoplayer Problem
    packagingOptions {
        exclude("META-INF/*.kotlin_module")
    }
}

dependencies {
    implementation project(':PrebidMobile')
    implementation project(':PrebidMobile-nextGenEventHandlers')

//    implementation 'com.github.veonadtech.prebid-android-sdk:mobile:0.3.0-test5'
//    implementation 'com.github.veonadtech.prebid-android-sdk:core:0.3.0-test5'
//    implementation 'com.github.veonadtech.prebid-android-sdk:eventhandlers.nextgen:0.3.0-test5'
//    implementation 'com.github.veonadtech.prebid-android-sdk:prebidorg:0.3.0-test5'

    // The Next-Gen GMA SDK ships its own copy of the gms.ads mediation/nativead classes, which
    // collide with the legacy play-services-ads artifacts pulled transitively via core. This demo
    // never uses the legacy GAM/multiadloader path, so exclude the colliding legacy artifacts
    // (play-services-ads 23.6.0 bundles them in -lite; newer versions bundle them in -api).
    configurations.configureEach {
        exclude group: "com.google.android.gms", module: "play-services-ads-lite"
        exclude group: "com.google.android.gms", module: "play-services-ads-api"
    }

    // Next-Gen GMA SDK (the GAM racer in multiloadernextgen)
    implementation libs.google.next.gen.sdk
    // For testing SNAPSHOT releases
    // implementation "org.prebid:prebid-mobile-sdk:$prebidSdkVersionName-SNAPSHOT"

    // Standard libraries
    implementation libs.kotlin.stdlib
    implementation libs.androidx.appcompat
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.viewmodel.ktx

    // Advertisement
    implementation(libs.google.next.gen.sdk)

    // Image Downloader
    implementation libs.glide

    // Multidex
    implementation libs.androidx.multidex

    // Yandex Mobile Ads SDK (the Yandex racer in multiloadernextgen)
    implementation(libs.yandex.ads) {
        exclude group: "com.yandex.ads.mediation", module: "mobileads-applovin"
        exclude group: "com.yandex.ads.mediation", module: "mobileads-appnext"
        exclude group: "com.yandex.ads.mediation", module: "mobileads-chartboost"
        exclude group: "com.yandex.ads.mediation", module: "mobileads-google"
        exclude group: "com.yandex.ads.mediation", module: "mobileads-inmobi"
        exclude group: "com.yandex.ads.mediation", module: "mobileads-mytarget"
        exclude group: "com.yandex.ads.mediation", module: "mobileads-pangle"
        exclude group: "com.yandex.ads.mediation", module: "mobileads-tapjoy"
        exclude group: "com.yandex.ads.mediation", module: "mobileads-unityads"
    }
    implementation("com.yandex.android:mobileads") {
        version {
            strictly("7.9.0")
        }
    }
    implementation("io.appmetrica.analytics:analytics") {
        version {
            strictly("7.9.0")
        }
    }
    // Video Player
//    implementation libs.exoplayer
//    implementation libs.exoplayer.core
//    implementation libs.exoplayer.ui
//    implementation libs.extension.ima

    // Tests
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.uiautomator
}
