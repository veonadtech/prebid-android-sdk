apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "org.prebid.veondemo"
    setCompileSdkVersion(34)
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        applicationId "org.prebid.veondemo"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        dataBinding true
    }
//    // Fix for Exoplayer Problem
//    packagingOptions {
//        exclude("META-INF/*.kotlin_module")
//    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
    lint {
        baseline = file("lint-baseline.xml")
        checkReleaseBuilds = false
    }
}

dependencies {
   implementation project(':PrebidMobile')
   implementation project(':PrebidMobile-gamEventHandlers')
 //  implementation project(':PrebidMobile-admobAdapters')
 //  implementation project(':PrebidMobile-maxAdapters')

//    implementation 'com.github.veonadtech.prebid-android-sdk:mobile:0.5.3-legacy'
//    implementation 'com.github.veonadtech.prebid-android-sdk:core:0.5.3-legacy'
//    implementation 'com.github.veonadtech.prebid-android-sdk:eventhandlers:0.5.3-legacy'
//    implementation 'com.github.veonadtech.prebid-android-sdk:prebidorg:0.5.3-legacy'

    // Standard libraries
    implementation libs.kotlin.stdlib
    implementation libs.androidx.appcompat
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.viewmodel.ktx

    // Advertisement
    implementation libs.google.play.services.base
    implementation libs.google.play.services.ads
    implementation libs.google.play.services.ads.identifier

    // Image Downloader
    implementation libs.glide

    // Multidex
    implementation libs.androidx.multidex

    // Video Player
    implementation libs.media3.exoplayer
    implementation libs.media3.ui
    implementation libs.media3.exoplayer.ima

    // Tests
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.uiautomator
}
